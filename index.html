<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人日程與網址管理系統</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- html2canvas CDN 用於匯出圖片 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        /* 自定義馬卡龍粉嫩色系主題 */
        body {
            background-color: #fdfbf7;
            color: #4a4a4a;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .macaron-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            border: 1px solid #f0eae1;
        }
        .macaron-btn-primary {
            background-color: #ffb7b2;
            color: #ffffff;
            transition: all 0.2s;
        }
        .macaron-btn-primary:hover {
            background-color: #ff9e9a;
        }
        .macaron-btn-secondary {
            background-color: #b5ead7;
            color: #2d3748;
            transition: all 0.2s;
        }
        .macaron-btn-secondary:hover {
            background-color: #9fe2cd;
        }
    </style>
</head>
<body class="p-4 md:p-8 max-w-5xl mx-auto">

    <!-- 頂部導航與標題 -->
    <header class="mb-8 text-center">
        <h1 class="text-3xl font-bold text-gray-700 mb-2">✨ 個人日程與工作管理系統</h1>
        <p class="text-sm text-gray-500">輕鬆規劃每日行程、管理各項事務與快速匯出記錄</p>
    </header>

    <!-- 主容器 (支援 html2canvas 截圖) -->
    <div class="calendar-container macaron-card p-6 mb-6">
        
        <!-- 月曆檢視控制列 -->
        <div class="flex justify-between items-center mb-6">
            <button id="btn-month-prev" class="px-3 py-1.5 rounded-lg bg-gray-100 hover:bg-gray-200 text-gray-600 text-sm font-medium">◀ 上個月</button>
            <h2 id="month-display" class="text-xl font-bold text-gray-700">2026年 9月</h2>
            <button id="btn-month-next" class="px-3 py-1.5 rounded-lg bg-gray-100 hover:bg-gray-200 text-gray-600 text-sm font-medium">下個月 ▶</button>
        </div>

        <!-- 日期選擇與快捷工具列 -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
            <div>
                <label class="block text-sm font-medium text-gray-600 mb-1">選擇指定日期</label>
                <input type="date" id="date-select" class="w-full px-4 py-2 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-[#ffb7b2]">
            </div>
            <div class="flex items-end gap-2">
                <button id="btn-quick-time" class="flex-1 py-2 px-4 rounded-xl macaron-btn-secondary font-medium text-sm">⚡ 插入快捷時間</button>
                <button id="color-toggle-btn" class="py-2 px-4 rounded-xl bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium text-sm">🎨 標籤管理</button>
            </div>
        </div>

        <!-- 快速跳轉按鈕區 -->
        <div class="flex flex-wrap gap-2 mb-6 pb-4 border-b border-gray-100">
            <button id="btn-jump-to-input" class="text-xs px-3 py-1.5 rounded-full bg-amber-50 text-amber-700 hover:bg-amber-100">👇 跳至新增欄位</button>
            <button id="btn-jump-to-sort" class="text-xs px-3 py-1.5 rounded-full bg-blue-50 text-blue-700 hover:bg-blue-100">⇅ 跳至排序設定</button>
            <button id="btn-toggle-emoji-modal" class="text-xs px-3 py-1.5 rounded-full bg-pink-50 text-pink-700 hover:bg-pink-100">😊 表情符號</button>
            <button id="btn-toggle-phrase-modal" class="text-xs px-3 py-1.5 rounded-full bg-purple-50 text-purple-700 hover:bg-purple-100">💬 常用短語</button>
        </div>

        <!-- 的時間軸/行程顯示區 -->
        <div id="timeline-container" class="space-y-3 mb-6">
            <div class="p-4 rounded-xl bg-gray-50 border border-dashed border-gray-200 text-center text-gray-400 text-sm">
                目前尚無行程，請從下方新增或選擇日期
            </div>
        </div>
    </div>

    <!-- 新增行程表單區 -->
    <div class="macaron-card p-6 mb-6">
        <h3 class="text-lg font-bold text-gray-700 mb-4">✍️ 新增行程與記錄</h3>
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-600 mb-1">標題 / 事項名稱</label>
                <input type="text" id="evt-title" placeholder="輸入行程標題..." class="w-full px-4 py-2 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-[#ffb7b2]">
            </div>
            <button id="add-evt-btn" class="w-full py-3 rounded-xl macaron-btn-primary font-bold shadow-sm">確認新增行程</button>
        </div>
    </div>

    <!-- 排序與匯出控制區 -->
    <div class="macaron-card p-6">
        <div id="sort-order-section" class="mb-6">
            <h3 class="text-sm font-bold text-gray-600 mb-2">排序設定</h3>
            <div class="flex gap-2">
                <button id="sort-btn-manual" class="flex-1 py-2 rounded-lg bg-gray-100 hover:bg-gray-200 text-xs font-medium text-gray-700">自訂排序</button>
                <button id="sort-btn-az" class="flex-1 py-2 rounded-lg bg-gray-100 hover:bg-gray-200 text-xs font-medium text-gray-700">筆畫/字母 A-Z</button>
                <button id="sort-btn-za" class="flex-1 py-2 rounded-lg bg-gray-100 hover:bg-gray-200 text-xs font-medium text-gray-700">筆畫/字母 Z-A</button>
            </div>
        </div>

        <div class="flex flex-col sm:flex-row gap-3">
            <button id="btn-export-pdf" class="flex-1 py-2.5 px-4 rounded-xl bg-gray-800 hover:bg-gray-900 text-white font-medium text-sm text-center">🖨️ 列印 / 匯出 PDF</button>
            <button id="btn-export-img" class="flex-1 py-2.5 px-4 rounded-xl bg-[#ffdac1] hover:bg-[#ffcbb3] text-gray-800 font-medium text-sm text-center">📷 匯出為圖片</button>
        </div>
    </div>

    <!-- JavaScript 邏輯區 -->
    <script>
        // 狀態變數初始化
        let currentDate = new Date().toISOString().split('T')[0];
        let viewYear = new Date().getFullYear();
        let viewMonth = new Date().getMonth();

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('date-select').value = currentDate;
            renderMonthCalendar();
            setupEventListeners();
        });

        function initDateConfig() {
            console.log("初始化日期配置:", currentDate);
        }

        function renderTimeline() {
            const container = document.getElementById('timeline-container');
            container.innerHTML = `<div class="p-3 rounded-xl bg-pink-50 text-pink-700 text-sm">📅 目前顯示日期：${currentDate} 的行程內容</div>`;
        }

        function renderQuickTimeBar() {
            // 快捷時間列更新邏輯
        }

        function submitEventForm() {
            const titleInput = document.getElementById('evt-title');
            if (!titleInput.value.trim()) {
                alert('請輸入行程標題！');
                return;
            }
            alert(`成功新增行程：${titleInput.value}`);
            titleInput.value = '';
            renderTimeline();
        }

        function insertQuickTime() {
            const titleInput = document.getElementById('evt-title');
            titleInput.value = "[09:00 - 12:00] " + titleInput.value;
        }

        function openManageModal() {
            alert('開啟標籤管理視窗');
        }

        function openEmojiModal() {
            alert('開啟表情符號或常用短語選單');
        }

        function setSortMode(mode) {
            alert(`已切換排序模式: ${mode}`);
        }

        function renderMonthCalendar() {
            const display = document.getElementById('month-display');
            display.textContent = `${viewYear}年 ${viewMonth + 1}月`;
        }

        function setupEventListeners() {
            document.getElementById('date-select').addEventListener('change', (e) => {
                if (e.target.value) {
                    currentDate = e.target.value;
                    initDateConfig();
                    renderTimeline();
                    renderQuickTimeBar();
                }
            });
            document.getElementById('add-evt-btn').addEventListener('click', submitEventForm);
            document.getElementById('btn-quick-time').addEventListener('click', insertQuickTime);
            document.getElementById('color-toggle-btn').addEventListener('click', openManageModal);
            document.getElementById('btn-toggle-emoji-modal').addEventListener('click', openEmojiModal);
            document.getElementById('btn-toggle-phrase-modal').addEventListener('click', openEmojiModal);
            document.getElementById('btn-jump-to-input').addEventListener('click', () => {
                document.getElementById('evt-title').scrollIntoView({ behavior: 'smooth' });
                document.getElementById('evt-title').focus();
            });
            document.getElementById('btn-jump-to-sort').addEventListener('click', () => {
                document.getElementById('sort-order-section').scrollIntoView({ behavior: 'smooth' });
            });
            document.getElementById('sort-btn-manual').addEventListener('click', () => setSortMode('manual'));
            document.getElementById('sort-btn-az').addEventListener('click', () => setSortMode('az'));
            document.getElementById('sort-btn-za').addEventListener('click', () => setSortMode('za'));
            document.getElementById('btn-export-pdf').addEventListener('click', () => window.print());
            document.getElementById('btn-export-img').addEventListener('click', () => {
                html2canvas(document.querySelector('.calendar-container')).then(canvas => {
                    const link = document.createElement('a');
                    link.download = currentDate + '-schedule.png';
                    link.href = canvas.toDataURL();
                    link.click();
                });
            });
            document.getElementById('btn-month-prev').addEventListener('click', () => {
                viewMonth--;
                if (viewMonth < 0) { viewMonth = 11; viewYear--; }
                renderMonthCalendar();
            });
            document.getElementById('btn-month-next').addEventListener('click', () => {
                viewMonth++;
                if (viewMonth > 11) { viewMonth = 0; viewYear++; }
                renderMonthCalendar();
            });
        }
    </script>
</body>
</html>
