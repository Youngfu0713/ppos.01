<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>書籍閱讀進度系統</title>
    <style>
        :root { --primary: #5151e5; --danger: #e11d48; --bg-main: #fcfbfa; --bg-card: #ffffff; --text-main: #1e293b; --text-muted: #64748b; --border: #f1f5f9; }
        body { font-family: sans-serif; background: var(--bg-main); color: var(--text-main); margin: 0; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 550px; background: var(--bg-card); min-height: 100vh; box-shadow: 0 10px 30px -10px rgba(0,0,0,0.1); }
        .header { padding: 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); }
        .tab-btn { border: none; background: none; font-size: 1.2rem; cursor: pointer; }
        
        .book-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; padding: 15px; }
        .book-card { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; cursor: pointer; transition: transform 0.2s; }
        .book-card:hover { transform: scale(1.02); }
        .cover-img { width: 100%; height: 180px; object-fit: cover; background: #eee; }
        .card-info { padding: 10px; }
        
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); z-index: 100; display: none; align-items: flex-end; }
        .modal-overlay.show { display: flex; }
        .action-sheet { width: 100%; background: var(--bg-card); border-radius: 20px 20px 0 0; padding: 20px; box-sizing: border-box; max-height: 80vh; overflow-y: auto; }
        
        input { width: 100%; margin-bottom: 10px; padding: 10px; border: 1px solid var(--border); border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; border: none; border-radius: 8px; cursor: pointer; margin-top: 5px; font-weight: bold; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-secondary { background: var(--border); color: var(--text-main); }
        .btn-danger { background: #fee2e2; color: var(--danger); }
        
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-top: 10px; }
        .cal-day { height: 40px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--border); border-radius: 4px; font-size: 0.8rem; }
        .has-read { background: var(--primary); color: white; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2 style="margin:0;" id="view-title">我的書櫃</h2>
        <div>
            <button class="tab-btn" onclick="toggleView()">📅</button>
            <button class="tab-btn" onclick="openModal('add-modal')">➕</button>
        </div>
    </div>

    <div id="grid-view" class="book-grid"></div>

    <div id="cal-view" style="display:none; padding:20px;">
        <div style="text-align:center; margin-bottom:10px;" id="cal-month-title"></div>
        <div class="calendar-grid" id="calendar-body"></div>
    </div>
</div>

<!-- 新增書籍 Modal -->
<div class="modal-overlay" id="add-modal">
    <div class="action-sheet">
        <h3>新增書籍</h3>
        <input type="file" id="b-cover-input" accept="image/*">
        <input type="text" id="b-title" placeholder="書籍名稱">
        <input type="number" id="b-total" placeholder="總頁數">
        <button class="btn-primary" onclick="addBook()">確定新增</button>
        <button class="btn-secondary" onclick="closeModal('add-modal')">取消</button>
    </div>
</div>

<!-- 編輯書籍 Modal (新增) -->
<div class="modal-overlay" id="edit-modal">
    <div class="action-sheet">
        <h3 id="edit-header">編輯書籍</h3>
        <input type="text" id="edit-title" placeholder="書名">
        <input type="number" id="edit-total" placeholder="總頁數">
        <button class="btn-primary" onclick="saveBookChanges()">儲存修改</button>
        <button class="btn-secondary" onclick="prepareUpdateProgress()">紀錄今日閱讀</button>
        <button class="btn-danger" onclick="deleteBook()">刪除書籍</button>
        <button style="background:none; color:var(--text-muted); margin-top:10px;" onclick="closeModal('edit-modal')">關閉</button>
    </div>
</div>

<!-- 更新進度 Modal -->
<div class="modal-overlay" id="update-modal">
    <div class="action-sheet">
        <h3>更新進度</h3>
        <input type="number" id="b-update-read" placeholder="目前閱讀頁數">
        <button class="btn-primary" onclick="saveProgress()">儲存進度</button>
        <button class="btn-secondary" onclick="closeModal('update-modal')">返回</button>
    </div>
</div>

<script>
    let books = JSON.parse(localStorage.getItem('my_books')) || [];
    let currentEditId = null;

    function openModal(id) { document.getElementById(id).classList.add('show'); }
    function closeModal(id) { document.getElementById(id).classList.remove('show'); }

    // 點擊卡片觸發編輯
    function editBook(id) {
        currentEditId = id;
        const b = books.find(x => x.id === id);
        document.getElementById('edit-title').value = b.title;
        document.getElementById('edit-total').value = b.total;
        openModal('edit-modal');
    }

    // 儲存書籍編輯
    function saveBookChanges() {
        const b = books.find(x => x.id === currentEditId);
        b.title = document.getElementById('edit-title').value;
        b.total = parseInt(document.getElementById('edit-total').value) || 1;
        localStorage.setItem('my_books', JSON.stringify(books));
        closeModal('edit-modal');
        render();
    }

    // 準備進入進度更新頁面
    function prepareUpdateProgress() {
        const b = books.find(x => x.id === currentEditId);
        document.getElementById('b-update-read').value = b.currentRead;
        closeModal('edit-modal');
        openModal('update-modal');
    }

    function deleteBook() {
        if(confirm('確定要刪除這本書嗎？')) {
            books = books.filter(x => x.id !== currentEditId);
            localStorage.setItem('my_books', JSON.stringify(books));
            closeModal('edit-modal');
            render();
        }
    }

    function addBook() {
        const title = document.getElementById('b-title').value;
        const total = parseInt(document.getElementById('b-total').value) || 1;
        const fileInput = document.getElementById('b-cover-input');
        
        if (!title) return alert("請輸入書名");

        if (fileInput.files && fileInput.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) { saveBook(title, total, e.target.result); };
            reader.readAsDataURL(fileInput.files[0]);
        } else {
            saveBook(title, total, null);
        }
    }

    function saveBook(title, total, coverData) {
        books.push({ id: Date.now(), title, total, currentRead: 0, history: [], cover: coverData });
        localStorage.setItem('my_books', JSON.stringify(books));
        closeModal('add-modal');
        render();
    }

    function saveProgress() {
        const newRead = parseInt(document.getElementById('b-update-read').value);
        const b = books.find(x => x.id === currentEditId);
        const today = new Date().toISOString().split('T')[0];
        const delta = newRead - b.currentRead;
        if(delta > 0) b.history.push({ date: today, pages: delta });
        b.currentRead = newRead;
        localStorage.setItem('my_books', JSON.stringify(books));
        closeModal('update-modal');
        render();
    }

    function toggleView() {
        const isCal = document.getElementById('cal-view').style.display === 'block';
        document.getElementById('grid-view').style.display = isCal ? 'grid' : 'none';
        document.getElementById('cal-view').style.display = isCal ? 'none' : 'block';
        document.getElementById('view-title').innerText = isCal ? '我的書櫃' : '閱讀月曆';
        if(!isCal) renderCalendar();
    }

    function renderCalendar() {
        const body = document.getElementById('calendar-body');
        body.innerHTML = '';
        const now = new Date();
        const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
        document.getElementById('cal-month-title').innerText = (now.getMonth()+1) + " 月閱讀紀錄";
        
        const readDates = new Set();
        books.forEach(b => b.history.forEach(h => readDates.add(h.date)));

        for(let i=1; i<=daysInMonth; i++) {
            const dateStr = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(i).padStart(2,'0');
            const div = document.createElement('div');
            div.className = 'cal-day' + (readDates.has(dateStr) ? ' has-read' : '');
            div.innerText = i;
            body.appendChild(div);
        }
    }

    function render() {
        const grid = document.getElementById('grid-view');
        grid.innerHTML = '';
        books.forEach(b => {
            const percent = Math.min(100, Math.round((b.currentRead / b.total) * 100));
            grid.innerHTML += `
                <div class="book-card" onclick="editBook(${b.id})">
                    <img src="${b.cover || 'https://via.placeholder.com/150?text=No+Cover'}" class="cover-img">
                    <div class="card-info">
                        <div style="font-weight:bold; font-size:0.9rem; margin-bottom:5px;">${b.title}</div>
                        <div style="width:100%; height:6px; background:#eee; border-radius:3px;">
                            <div style="width:${percent}%; height:100%; background:var(--primary); border-radius:3px;"></div>
                        </div>
                        <div style="font-size:0.7rem; color:var(--text-muted); margin-top:5px;">${percent}% 完成</div>
                    </div>
                </div>
            `;
        });
    }

    render();
</script>
</body>
</html>
