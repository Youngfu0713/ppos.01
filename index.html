<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>書籍閱讀進度系統</title>
    <style>
        :root {
            --primary: #5151e5;
            --primary-light: #ede9fe;
            --danger: #e11d48;
            --bg-main: #f8f7f5;
            --bg-card: #ffffff;
            --text-main: #1e293b;
            --text-muted: #94a3b8;
            --border: #f1f5f9;
            --grid-cols: 4; /* 預設 4 欄 */
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg-main); color: var(--text-main); display: flex; justify-content: center; min-height: 100vh; }

        .container { width: 100%; max-width: 540px; background: var(--bg-card); min-height: 100vh; box-shadow: 0 10px 40px -10px rgba(0,0,0,0.08); display: flex; flex-direction: column; }

        .header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
        .header h2 { font-size: 1.25rem; font-weight: 700; }

        .controls { padding: 10px 20px; display: flex; gap: 8px; align-items: center; border-bottom: 1px solid var(--border); }
        select, button { padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border); background: white; font-size: 0.85rem; cursor: pointer; }
        
        .grid-toggles { display: flex; gap: 4px; }
        .grid-btn { padding: 5px 8px; font-weight: 600; }
        .grid-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        .content-area { flex: 1; padding: 16px; }
        
        /* 動態 Grid */
        .book-grid { display: grid; grid-template-columns: repeat(var(--grid-cols), 1fr); gap: 12px; }
        
        .book-card { background: white; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; cursor: pointer; transition: transform 0.15s; }
        .book-card:hover { transform: scale(1.02); }
        
        .cover-img { width: 100%; aspect-ratio: 3/4; object-fit: cover; background: #e2e8f0; display: flex; align-items: center; justify-content: center; color: #94a3b8; }
        
        .card-info { padding: 10px; }
        .card-title { font-weight: 600; font-size: 0.85rem; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .progress-bar { width: 100%; height: 4px; background: #eee; border-radius: 2px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--primary); }

        /* 極簡模式 (針對 3+ 欄位) */
        .compact .card-info { display: none; }
        .compact .cover-img { aspect-ratio: 3/4; }

        .add-btn { width: 40px; height: 40px; border: none; border-radius: 10px; background: var(--primary); color: white; cursor: pointer; }

        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.3); display: none; align-items: center; justify-content: center; z-index: 100; }
        .modal-overlay.show { display: flex; }
        .action-sheet { background: white; width: 90%; max-width: 400px; padding: 24px; border-radius: 16px; }
        .form-group { margin-bottom: 15px; }
        input { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ddd; border-radius: 8px; }
        .btn-row { display: flex; gap: 10px; margin-top: 20px; }
        button.primary { flex: 1; background: var(--primary); color: white; border: none; padding: 12px; border-radius: 8px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>我的書櫃</h2>
        <button class="add-btn" onclick="openModal()">＋</button>
    </div>

    <div class="controls">
        <select id="sort-select" onchange="applySort()">
            <option value="newest">最新加入</option>
            <option value="title">按書名排序</option>
            <option value="progress">按閱讀進度</option>
        </select>
        <div class="grid-toggles">
            <button class="grid-btn" onclick="setCols(2)">2</button>
            <button class="grid-btn" onclick="setCols(3)">3</button>
            <button class="grid-btn active" onclick="setCols(4)" id="btn-4">4</button>
            <button class="grid-btn" onclick="setCols(5)">5</button>
        </div>
    </div>

    <div class="content-area">
        <div id="book-grid" class="book-grid"></div>
    </div>
</div>

<!-- 新增/編輯視窗 -->
<div class="modal-overlay" id="modal">
    <div class="action-sheet">
        <h3 id="modal-title">新增書籍</h3>
        <input type="hidden" id="edit-id">
        <div class="form-group">
            <label>書名</label>
            <input type="text" id="b-title">
        </div>
        <div class="form-group">
            <label>總頁數</label>
            <input type="number" id="b-total">
        </div>
        <div class="form-group" id="current-read-group" style="display:none;">
            <label>目前進度(頁)</label>
            <input type="number" id="b-current">
        </div>
        <div class="btn-row">
            <button onclick="closeModal()">取消</button>
            <button class="primary" onclick="saveBook()">儲存</button>
        </div>
    </div>
</div>

<script>
    let books = JSON.parse(localStorage.getItem('my_books')) || [];
    let currentCols = 4;

    function setCols(n) {
        currentCols = n;
        document.documentElement.style.setProperty('--grid-cols', n);
        document.querySelectorAll('.grid-btn').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');
        render();
    }

    function applySort() {
        const val = document.getElementById('sort-select').value;
        if (val === 'title') books.sort((a,b) => a.title.localeCompare(b.title));
        else if (val === 'progress') books.sort((a,b) => (b.currentRead/b.total) - (a.currentRead/a.total));
        else books.sort((a,b) => b.id - a.id);
        render();
    }

    function render() {
        const grid = document.getElementById('book-grid');
        grid.innerHTML = '';
        const isCompact = currentCols >= 3;
        
        books.forEach(b => {
            const pct = Math.round((b.currentRead / b.total) * 100);
            const card = document.createElement('div');
            card.className = 'book-card' + (isCompact ? ' compact' : '');
            card.onclick = () => openModal(b.id);
            card.innerHTML = `
                <div class="cover-img">📘</div>
                <div class="card-info">
                    <div class="card-title">${b.title}</div>
                    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    function openModal(id = null) {
        const modal = document.getElementById('modal');
        modal.classList.add('show');
        if (id) {
            const b = books.find(x => x.id === id);
            document.getElementById('modal-title').innerText = '編輯書籍';
            document.getElementById('edit-id').value = b.id;
            document.getElementById('b-title').value = b.title;
            document.getElementById('b-total').value = b.total;
            document.getElementById('b-current').value = b.currentRead;
            document.getElementById('current-read-group').style.display = 'block';
        } else {
            document.getElementById('modal-title').innerText = '新增書籍';
            document.getElementById('edit-id').value = '';
            document.getElementById('b-title').value = '';
            document.getElementById('b-total').value = '';
            document.getElementById('current-read-group').style.display = 'none';
        }
    }

    function closeModal() { document.getElementById('modal').classList.remove('show'); }

    function saveBook() {
        const id = document.getElementById('edit-id').value;
        const title = document.getElementById('b-title').value;
        const total = parseInt(document.getElementById('b-total').value);
        
        if (id) {
            const b = books.find(x => x.id == id);
            b.title = title;
            b.total = total;
            b.currentRead = parseInt(document.getElementById('b-current').value);
        } else {
            books.push({ id: Date.now(), title, total, currentRead: 0 });
        }
        localStorage.setItem('my_books', JSON.stringify(books));
        closeModal();
        render();
    }

    render();
</script>
</body>
</html>
