<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>書籍閱讀進度系統</title>
    <style>
        :root { --primary: #5151e5; --bg-main: #fcfbfa; --bg-card: #ffffff; --text-main: #1e293b; --text-muted: #64748b; --border: #f1f5f9; }
        body { font-family: sans-serif; background: var(--bg-main); color: var(--text-main); margin: 0; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 550px; background: var(--bg-card); min-height: 100vh; box-shadow: 0 10px 30px -10px rgba(0,0,0,0.1); }
        .header { padding: 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); }
        .tab-btn { border: none; background: none; font-size: 1.2rem; cursor: pointer; }
        
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); z-index: 100; display: none; align-items: flex-end; }
        .modal-overlay.show { display: flex; }
        .action-sheet { width: 100%; background: var(--bg-card); border-radius: 20px 20px 0 0; padding: 20px; box-sizing: border-box; max-height: 80vh; overflow-y: auto; }
        
        .book-card { border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin: 10px; display: flex; align-items: center; gap: 12px; cursor: pointer; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-top: 10px; }
        .cal-day { height: 40px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--border); border-radius: 4px; font-size: 0.8rem; }
        .has-read { background: var(--primary); color: white; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2 style="margin:0;" id="view-title">書籍進度</h2>
        <div>
            <button class="tab-btn" onclick="toggleView()">📅</button>
            <button class="tab-btn" onclick="openModal('add-modal')">⚙️</button>
        </div>
    </div>

    <!-- 清單視圖 -->
    <div id="list-view">
        <div id="book-list"></div>
    </div>

    <!-- 月曆視圖 -->
    <div id="cal-view" style="display:none; padding:20px;">
        <div style="text-align:center; margin-bottom:10px;" id="cal-month-title"></div>
        <div class="calendar-grid" id="calendar-body"></div>
    </div>
</div>

<!-- 新增書籍 Modal -->
<div class="modal-overlay" id="add-modal">
    <div class="action-sheet">
        <h3>新增書籍</h3>
        <input type="text" id="b-title" placeholder="書籍名稱" style="width:100%; margin-bottom:10px; padding:10px; border:1px solid var(--border); border-radius:8px;">
        <input type="text" id="b-author" placeholder="作者 (選填)" style="width:100%; margin-bottom:10px; padding:10px; border:1px solid var(--border); border-radius:8px;">
        <label>開始閱讀日期：</label>
        <input type="date" id="b-start-date" style="width:100%; margin-bottom:10px; padding:10px; border:1px solid var(--border); border-radius:8px;">
        <input type="number" id="b-total" placeholder="總頁數" style="width:100%; margin-bottom:10px; padding:10px; border:1px solid var(--border); border-radius:8px;">
        <button onclick="addBook()" style="width:100%; padding:12px; background:var(--primary); color:white; border:none; border-radius:8px;">確定新增</button>
        <button onclick="closeModal('add-modal')" style="width:100%; margin-top:10px; background:none; border:none; color:var(--text-muted);">取消</button>
    </div>
</div>

<!-- 更新進度 Modal -->
<div class="modal-overlay" id="update-modal">
    <div class="action-sheet">
        <h3 id="update-title">更新進度</h3>
        <input type="number" id="b-update-read" placeholder="目前閱讀頁數" style="width:100%; margin-bottom:20px; padding:10px; border:1px solid var(--border); border-radius:8px;">
        <button onclick="saveProgress()" style="width:100%; padding:12px; background:var(--primary); color:white; border:none; border-radius:8px;">紀錄今日閱讀</button>
    </div>
</div>

<script>
    let books = JSON.parse(localStorage.getItem('my_books')) || [];
    let currentEditId = null;

    function openModal(id) { document.getElementById(id).classList.add('show'); }
    function closeModal(id) { document.getElementById(id).classList.remove('show'); }

    function addBook() {
        const title = document.getElementById('b-title').value;
        const author = document.getElementById('b-author').value || "未標記";
        const total = parseInt(document.getElementById('b-total').value) || 1;
        const startDate = document.getElementById('b-start-date').value || new Date().toISOString().split('T')[0];
        
        books.push({ 
            id: Date.now(), title, author, total, currentRead: 0, startDate, history: [] 
        });
        localStorage.setItem('my_books', JSON.stringify(books));
        closeModal('add-modal');
        render();
    }

    function editBook(id) {
        currentEditId = id;
        const b = books.find(x => x.id === id);
        document.getElementById('update-title').innerText = "更新 " + b.title;
        document.getElementById('b-update-read').value = b.currentRead;
        openModal('update-modal');
    }

    function saveProgress() {
        const newRead = parseInt(document.getElementById('b-update-read').value);
        const b = books.find(x => x.id === currentEditId);
        const today = new Date().toISOString().split('T')[0];
        
        const delta = newRead - b.currentRead;
        if(delta > 0) {
            b.history.push({ date: today, pages: delta });
        }
        b.currentRead = newRead;
        
        localStorage.setItem('my_books', JSON.stringify(books));
        closeModal('update-modal');
        render();
    }

    function toggleView() {
        const isCal = document.getElementById('cal-view').style.display === 'block';
        document.getElementById('list-view').style.display = isCal ? 'block' : 'none';
        document.getElementById('cal-view').style.display = isCal ? 'none' : 'block';
        document.getElementById('view-title').innerText = isCal ? '書籍進度' : '閱讀月曆';
        if(!isCal) renderCalendar();
    }

    function renderCalendar() {
        const body = document.getElementById('calendar-body');
        body.innerHTML = '';
        const now = new Date();
        const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
        document.getElementById('cal-month-title').innerText = (now.getMonth()+1) + " 月閱讀紀錄";
        
        // 收集所有閱讀過的日期
        const readDates = new Set();
        books.forEach(b => b.history.forEach(h => readDates.add(h.date)));

        for(let i=1; i<=daysInMonth; i++) {
            const dateStr = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(i).padStart(2,'0');
            const div = document.createElement('div');
            div.className = 'cal-day' + (readDates.has(dateStr) ? ' has-read' : '');
            div.innerText = i;
            body.appendChild(div);
        }
    }

    function render() {
        const list = document.getElementById('book-list');
        list.innerHTML = '';
        books.forEach(b => {
            const percent = Math.min(100, Math.round((b.currentRead / b.total) * 100));
            list.innerHTML += `
                <div class="book-card" onclick="editBook(${b.id})">
                    <div style="flex:1;">
                        <div style="font-weight:bold;">${b.title} (${percent}%)</div>
                        <div style="font-size:0.8rem; color:var(--text-muted);">作者：${b.author} | 開始：${b.startDate}</div>
                        <div style="width:100%; height:6px; background:#eee; border-radius:3px; margin:5px 0;">
                            <div style="width:${percent}%; height:100%; background:var(--primary); border-radius:3px;"></div>
                        </div>
                    </div>
                </div>
            `;
        });
    }

    render();
</script>
</body>
</html>
