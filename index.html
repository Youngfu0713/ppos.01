<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知識收藏庫</title>
    <style>
        :root {
            --primary: #5151e5;
            --primary-light: #ede9fe;
            --primary-dark: #4343d1;
            --danger: #e11d48;
            --danger-light: #fee2e2;
            --success: #059669;
            --success-light: #d1fae5;
            --bg-main: #f8f7f5;
            --bg-card: #ffffff;
            --text-main: #1e293b;
            --text-muted: #94a3b8;
            --border: #f1f5f9;
            --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
            --shadow-lg: 0 8px 24px rgba(0,0,0,0.08);
            --radius: 14px;
            --radius-sm: 10px;
            --transition: 0.2s ease;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang TC", "Helvetica Neue", sans-serif;
            background: var(--bg-main);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 540px;
            background: var(--bg-card);
            min-height: 100vh;
            box-shadow: 0 10px 40px -10px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 18px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            background: var(--bg-card);
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .header h2 {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .add-btn {
            width: 38px;
            height: 38px;
            border: none;
            border-radius: var(--radius-sm);
            background: var(--primary);
            color: white;
            font-size: 1.25rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .add-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 12px rgba(81,81,229,0.3);
        }

        /* Platform Filter Tabs */
        .filter-bar {
            display: flex;
            gap: 8px;
            padding: 14px 20px;
            border-bottom: 1px solid var(--border);
            overflow-x: auto;
            background: #fafaf9;
        }
        .filter-tab {
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: white;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            white-space: nowrap;
            transition: all var(--transition);
        }
        .filter-tab.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: var(--shadow);
        }

        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
        }

        .link-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .link-row {
            display: flex;
            align-items: center;
            gap: 14px;
            background: white;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px;
            cursor: pointer;
            transition: transform 0.18s, box-shadow 0.18s;
        }
        .link-row:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
        }
        .platform-icon {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
            background: var(--primary-light);
            color: var(--primary);
        }
        .link-info {
            flex: 1;
            min-width: 0;
        }
        .link-title {
            font-weight: 600;
            font-size: 0.92rem;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .link-url {
            font-size: 0.75rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .link-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .delete-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1rem;
            padding: 4px;
            transition: color 0.15s;
        }
        .delete-btn:hover { color: var(--danger); }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }
        .empty-icon { font-size: 3rem; margin-bottom: 12px; }
        .empty-text { font-size: 0.9rem; }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.35);
            z-index: 200;
            display: none;
            align-items: flex-end;
        }
        .modal-overlay.show { display: flex; animation: fadeIn 0.2s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .action-sheet {
            width: 100%;
            background: var(--bg-card);
            border-radius: 20px 20px 0 0;
            padding: 20px;
            max-height: 82vh;
            overflow-y: auto;
            animation: slideUp 0.25s ease;
        }
        .action-sheet h3 { font-size: 1.15rem; margin-bottom: 16px; }
        .form-group { margin-bottom: 14px; }
        .form-label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }
        input[type="text"], select {
            width: 100%;
            padding: 11px 14px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 0.95rem;
            background: #fafaf9;
            outline: none;
        }
        select { appearance: none; }
        button.btn-primary {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 11px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            background: var(--primary);
            color: white;
            transition: all 0.15s;
        }
        button.btn-secondary {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 11px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            background: #f1f5f9;
            color: var(--text-main);
        }
        .btn-row { display: flex; gap: 8px; margin-top: 12px; }
        .btn-row button { flex: 1; }
        ::-webkit-scrollbar { width: 0; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>知識收藏庫</h2>
        <div class="header-actions">
            <button class="add-btn" onclick="app.openModal('add-modal')">＋</button>
        </div>
    </div>

    <div class="filter-bar">
        <button class="filter-tab active" data-filter="all" onclick="app.setFilter('all')">全部</button>
        <button class="filter-tab" data-filter="youtube" onclick="app.setFilter('youtube')">YouTube</button>
        <button class="filter-tab" data-filter="bilibili" onclick="app.setFilter('bilibili')">Bilibili</button>
        <button class="filter-tab" data-filter="threads" onclick="app.setFilter('threads')">Threads</button>
        <button class="filter-tab" data-filter="other" onclick="app.setFilter('other')">其他</button>
    </div>

    <div class="content-area">
        <div id="link-list" class="link-list"></div>
    </div>
</div>

<!-- Add Modal -->
<div class="modal-overlay" id="add-modal">
    <div class="action-sheet">
        <h3>🔗 新增分享連結</h3>
        <div class="form-group">
            <label class="form-label">標題</label>
            <input type="text" id="l-title" placeholder="例如：精選教學影片">
        </div>
        <div class="form-group">
            <label class="form-label">平台</label>
            <select id="l-platform">
                <option value="youtube">YouTube</option>
                <option value="bilibili">Bilibili</option>
                <option value="threads">Threads</option>
                <option value="other">其他</option>
            </select>
        </div>
        <div class="form-group">
            <label class="form-label">分享連結 (URL)</label>
            <input type="text" id="l-url" placeholder="https://...">
        </div>
        <div class="btn-row">
            <button class="btn-secondary" onclick="app.closeModal('add-modal')">取消</button>
            <button class="btn-primary" onclick="app.addLink()">確定新增</button>
        </div>
    </div>
</div>

<script>
(function () {
    'use strict';
    const STORAGE_KEY = 'knowledge_links';
    let links = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [
        { id: 1, title: '範例 YouTube 影片', platform: 'youtube', url: 'https://www.youtube.com/watch?v=dQw4w9WgXcQ' }
    ];
    let currentFilter = 'all';

    function saveLinks() { localStorage.setItem(STORAGE_KEY, JSON.stringify(links)); }
    function escHtml(str) { var d = document.createElement('div'); d.textContent = str; return d.innerHTML; }

    function getPlatformIcon(platform) {
        switch(platform) {
            case 'youtube': return '▶';
            case 'bilibili': return 'B';
            case 'threads': return '@';
            default: return '🔗';
        }
    }

    function extractYouTubeId(url) {
        const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
        const match = url.match(regExp);
        return (match && match[2].length === 11) ? match[2] : null;
    }

    function render() {
        const filtered = currentFilter === 'all' 
            ? links 
            : links.filter(l => l.platform === currentFilter);

        const container = document.getElementById('link-list');
        if (filtered.length === 0) {
            container.innerHTML = '<div class="empty-state"><div class="empty-icon">📂</div><div class="empty-text">尚無收藏連結</div></div>';
            return;
        }

        container.innerHTML = filtered.map(l => `
            <div class="link-row" onclick="app.openLink(${l.id})">
                <div class="platform-icon">${getPlatformIcon(l.platform)}</div>
                <div class="link-info">
                    <div class="link-title">${escHtml(l.title)}</div>
                    <div class="link-url">${escHtml(l.url)}</div>
                </div>
                <div class="link-actions">
                    <button class="delete-btn" onclick="event.stopPropagation(); app.deleteLink(${l.id})" title="刪除">🗑</button>
                </div>
            </div>
        `).join('');
    }

    window.app = {
        openModal: (id) => document.getElementById(id).classList.add('show'),
        closeModal: (id) => document.getElementById(id).classList.remove('show'),
        setFilter: (filter) => {
            currentFilter = filter;
            document.querySelectorAll('.filter-tab').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.filter === filter);
            });
            render();
        },
        addLink: () => {
            const title = document.getElementById('l-title').value.trim();
            const platform = document.getElementById('l-platform').value;
            const url = document.getElementById('l-url').value.trim();
            if (!title || !url) return;

            links.unshift({ id: Date.now(), title, platform, url });
            saveLinks();
            render();
            document.getElementById('l-title').value = '';
            document.getElementById('l-url').value = '';
            app.closeModal('add-modal');
        },
        deleteLink: (id) => {
            links = links.filter(l => l.id !== id);
            saveLinks();
            render();
        },
        openLink: (id) => {
            const l = links.find(item => item.id === id);
            if (!l) return;

            if (l.platform === 'youtube') {
                const videoId = extractYouTubeId(l.url);
                if (videoId) {
                    window.location.href = 'vnd.youtube://' + videoId;
                    setTimeout(() => {
                        window.open(l.url, '_blank');
                    }, 400);
                    return;
                }
            }
            window.open(l.url, '_blank');
        }
    };

    render();
})();
</script>
</body>
</html>
